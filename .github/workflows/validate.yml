name: Validate question bank
on:
  push:
    branches: [main, feature/manual-question-import]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-questions.mjs
      - run: node scripts/build-question-index.mjs --check
      - run: node scripts/analyze-coverage.mjs --check
      - run: node --test scripts/question-coverage-test.mjs scripts/question-generation-test.mjs scripts/question-review-test.mjs scripts/question-import-test.mjs
      - run: node --check assets/assessment.js
      - run: node --check assets/app.js
      - run: node --check assets/dialogs.js
      - run: node scripts/assessment-test.mjs
      - run: node scripts/smoke-test.mjs
