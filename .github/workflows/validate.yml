name: Validate question bank
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-questions.mjs
      - run: node --check assets/assessment.js
      - run: node --check assets/app.js
      - run: node --check assets/dialogs.js
      - run: node scripts/assessment-test.mjs
      - run: node scripts/smoke-test.mjs
